---
- name: Setup Apache Virtual Host
  hosts: webservers
  become: yes

  vars:
    server_name: example.com
    document_root: /var/www/example.com

  tasks:

    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Create document root
      file:
        path: "{{ document_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Create index.html
      copy:
        dest: "{{ document_root }}/index.html"
        content: "<h1>Welcome to {{ server_name }}</h1>"

    - name: Create virtual host config
      template:
        src: vhost.conf.j2
        dest: "/etc/apache2/sites-available/{{ server_name }}.conf"

    - name: Enable virtual host
      command: a2ensite "{{ server_name }}.conf"
      notify: Restart Apache

    - name: Disable default site
      command: a2dissite 000-default.conf
      notify: Restart Apache

    - name: Ensure Apache is running
      service:
        name: apache2
        state: started
        enabled: true

  handlers:
    - name: Restart Apache
      service:
        name: apache2
        state: restarted
